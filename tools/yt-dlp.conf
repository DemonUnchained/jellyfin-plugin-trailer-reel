# Trailer Reel defaults for the official Jellyfin 12 container.
# Deno is explicitly located because /config/trailer-tools is not added to PATH.
--js-runtimes deno:/config/trailer-tools/deno
--remote-components ejs:github
--ffmpeg-location /usr/lib/jellyfin-ffmpeg/ffmpeg
--retries 10
--fragment-retries 10
--socket-timeout 30
--no-playlist
