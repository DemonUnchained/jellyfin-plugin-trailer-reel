name: Build and release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build, test, and package
        run: bash ./build.sh
      - uses: actions/upload-artifact@v5
        with:
          name: TrailerReel
          path: |
            dist/trailer-reel_*.zip
            dist/jellyfin-trailer-reel-source_*.zip
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          asset="$(find dist -maxdepth 1 -type f -name 'trailer-reel_*.zip' -print -quit)"
          version="$(basename "$asset" .zip)"
          version="${version#trailer-reel_}"
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install_asset="$(find dist -maxdepth 1 -type f -name 'trailer-reel_*.zip' -print -quit)"
          source_asset="$(find dist -maxdepth 1 -type f -name 'jellyfin-trailer-reel-source_*.zip' -print -quit)"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$install_asset" "$source_asset" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$install_asset" "$source_asset" \
              --title "Trailer Reel ${GITHUB_REF_NAME#v}" \
              --generate-notes
          fi
